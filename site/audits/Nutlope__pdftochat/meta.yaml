# Audited with 0.1.0-dev.14, scored with 0.1.0-dev.15. Unattended, read-only, on a clone of main at
# the commit below; the app was not run, no provider was called and no dependencies were installed
# (the locked library versions were read from their npm tarballs). Changes to the findings file the
# audit wrote: the Pinecone and MongoDB note now names LP-GE-13 (medium), since its embedding model
# was removed from Together serverless. The evidence is the audit's own, unchanged; notes are never
# scored and a rule id does not change a share, so the static score (82) and the big number are
# unchanged. Prior art: the missing timeout is issue #27 (open), recorded as known and left out of
# the score. One wording change, for the site's no-exclamation-mark rule: "passes embeddings!
# (undefined)" now reads "passes that undefined value on behind a non-null assertion". The headline
# is a note (no token cost), so the big number is the largest open finding, the context placed
# before the chat history. No response from the maintainers yet (checked 2026-11-27).
