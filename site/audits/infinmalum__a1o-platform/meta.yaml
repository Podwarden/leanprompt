# Audited with leanprompt 0.1.0-dev.14, unattended, on a clone of main (the only branch) at the
# commit below. The audit covers the gateway's billing, its protocol converters and the built-in
# Studio agent's own calls. Changes to the findings file the audit wrote: wording only (the notes say
# what the code bills, not who pays; the cache-billing note carries its worked example and the dated
# list prices it rests on; the removed design note is cited by the commit that removed it). Prior art
# checked: issues and discussions are turned off; the README, docs/, all commit subjects, the 17
# closed pull requests and the design notes removed in 31df916a mention no prompt caching, cache
# marks or cache pricing. The token figures rest on an assumed call mix, stated on each finding.
# Re-scored with 0.1.0-dev.15 (2026-11-27): the file is marked as a gateway, each item says whether
# it is about the gateway's own calls or its clients' calls, and the 502 note names LP-GE-12 (high,
# proxied). The evidence is the audit's own, unchanged; notes are never scored and a rule id does
# not change a share, so the static score and the big number are unchanged.
