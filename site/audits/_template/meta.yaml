# One audit = one folder, site/audits/<owner>__<repo>/ (the GitHub owner and repository name,
# two underscores between them), holding this file and the audit's findings.json, unchanged
# from what `/leanprompt audit` wrote to .leanprompt/findings.json.
#
# The build (npm run build:site) refuses an audit that breaks a rule below. Folders whose
# name starts with "_", like this one, are never published.
#
# Before publishing: open an issue (or a discussion) on the repository with the findings,
# set status: notified and link it below, and give the maintainers time to answer.

# The repository audited. Must be a PUBLIC repository on github.com.
repo: https://github.com/<owner>/<repo>
# Required, and must say public: only audits of public repositories are published.
visibility: public
# The full 40-character SHA of the commit the audit read.
commit: 0000000000000000000000000000000000000000
# The leanprompt version that ran the audit (npx leanprompt --version).
leanprompt: 0.1.0
# The day the audit ran.
date: 2026-12-01
# draft      not published (the build skips it)
# notified   the maintainers were told (needs maintainer.issue or maintainer.pr)
# published  published without a maintainer thread; when the repository has no public channel
#            (issues and discussions turned off), say so in no_channel below
# acknowledged, fixed, disputed   what the maintainers said (needs maintainer.issue or .pr;
#            disputed also needs maintainer.response)
# withdrawn  taken down (the build skips it; keep the folder as the record)
# demo       an audit of leanprompt's own examples
status: draft
# Optional: the folder audited, when it was not the whole repository.
# path: src/llm
# Optional: one or two neutral sentences for the audits list (at most 400 characters).
# summary: ...
# Required to publish: the top of the card and the page.
# headline   the mistake in plain words, present tense, at most 80 characters. The mistake is the
#            subject, never the people: no mocking words, no exclamation marks, no em dashes.
# subtitle   one sentence: what the app is and something it already does well.
# kind       one of: Cut-off answer, Retry loop, Cache never hits, Blind spend meter,
#            Setting that does nothing, Runs again every night, Wrong text summarised
# figure     the big number. Tokens per 1,000 calls of one finding (finding: its id or file:line;
#            left out, the largest open finding), always shown as an estimate; or a count read
#            from the project's own output (count: "66 of 558"), shown as counted. label says what
#            the number measures; unit: runs when the findings count per run of a CLI or batch tool.
# headline: "A timestamp at the top of the prompt means no call can reuse the cache"
# subtitle: >-
#   An example chat app that keeps its whole handbook in one system prompt.
# kind: Cache never hits
# figure:
#   finding: src/agent/prompt.ts:12
#   label: for a handbook the cache could have served
# Optional: where the maintainers were told, and what they said.
# maintainer:
#   issue: https://github.com/<owner>/<repo>/issues/123
#   pr: https://github.com/<owner>/<repo>/pull/124
#   response: Their words, quoted or summarised with their agreement.
#   response_date: 2026-12-03
# Optional, status published only: why there is no maintainer thread to link, in literally true
# words, shown as the page's status (at most 300 characters).
# no_channel: >-
#   The repository has issues and discussions turned off, so there was no public channel to report
#   this. The maintainers can reach us at info@podwarden.com.
