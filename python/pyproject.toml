[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "leanprompt-cli"
version = "0.1.0.dev0"
description = "The leanprompt usage logger for Python apps: one JSON line per LLM call with keyed prompt ids and token counts, never prompt text."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["kvsig==0.1.0"]
authors = [{ name = "PodWarden Team" }]
keywords = ["llm", "prompt-cache", "kvsig", "leanprompt"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3"]

[project.urls]
Homepage = "https://github.com/Podwarden/leanprompt"

[tool.hatch.build.targets.wheel]
packages = ["src/leanprompt_cli"]
